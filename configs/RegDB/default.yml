MODEL:
  NAME: 'CASS-Net'
  METHOD: 'CASS'
  PRETRAIN_CHOICE: 'imagenet'
  MIX_DIM: 768
  PRETRAIN_PATH_T: 'your_pretrain_model_path'
  TRANSFORMER_TYPE: 'vit_base_patch16_224'
  STRIDE_SIZE: [ 16, 16]
  SIE_CAMERA: False
  DIST_TRAIN: False
  AL: 1
  AGF: 0
  QUALITY_AWARE: 0
  MODALITY_ADAPTER: 0
  PART_BRANCH: 0
  CASS_ABLATION_STAGE: 'hss_nga'
  CASS_DESCRIPTOR_MODE: 'cls'
  CASS_CLS_CONTEXT_WEIGHT: 0.15
  CASS_QUALITY_AWARE: 0
  CASS_PART_BRANCH: 0
  CASS_NGA_MEMORY: 1
  CASS_NGA_REFRESH_PERIOD: 2
  CASS_NGA_WARMUP_EPOCHS: 5
  CASS_NGA_EMA_MOMENTUM: 0.5
  CASS_NGA_USE_PROTOTYPE: 1
  CASS_NGA_QUERY_ANCHOR: 1
  CASS_NGA_RESIDUAL_MODE: 'cross_mean'
  CASS_NGA_RESIDUAL_WEIGHT: 0.10
  CASS_FUSED_LOSS_WEIGHT: 1.0
  CASS_MODAL_LOSS_WEIGHT: 0.5
  CASS_PART_LOSS_WEIGHT: 0.25
INPUT:
  SIZE_TRAIN: [ 192, 384 ]
  SIZE_TEST: [ 192, 384 ]
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  GRAY_REPLACE_PROB: 0.3
  MODALITY_DROP_PROB: 0.0
DATASETS:
  NAMES: 'RegDB'
  ROOT_DIR: 'your_dataset_path'
  MODALITIES: 2
  CROSS_MODAL_EVAL: True
  REGDB_SPLIT: 1
  REGDB_QUERY_MODALITY: 'thermal'
DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 8
  NUM_WORKERS : 14
SOLVER:
  OPTIMIZER_NAME: 'AdamW'
  BASE_LR: 0.0001
  WEIGHT_DECAY: 0.05
  BACKBONE_LR_FACTOR: 0.1
  WARMUP_ITERS: 20
  IMS_PER_BATCH: 40
  MAX_EPOCHS: 120
  TRAIN_EPOCHS: 20
  AMP: True
  AMP_DTYPE: 'fp16'
  SCHEDULER_UNIT: 'iteration'
TEST:
  RE_RANKING: 'no'
  WEIGHT: ''
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'
OUTPUT_DIR: './outputs/CASS-Net'
