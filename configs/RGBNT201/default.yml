MODEL:
  NAME: 'CASS-Net'
  METHOD: 'CASS'
  PRETRAIN_CHOICE: 'imagenet'
  MIX_DIM: 768
  PRETRAIN_PATH_T: 'timm://vit_base_patch16_224.augreg2_in21k_ft_in1k'
  TRANSFORMER_TYPE: 'vit_base_patch16_224'
  STRIDE_SIZE: [ 16, 16 ]
  SIE_CAMERA: True
  DIST_TRAIN: False
  FREQUENCY_KEEP: 10
  FACSS_DYNAMIC_K: 1
  FACSS_MIN_K: 8
  FACSS_MAX_K: 32
  FACSS_SOFT_RESIDUAL_WEIGHT: 0.15
  HEAD_KEEP: 2
  AL: 0
  AGF: 0
  AGF_NUM_HEADS: 12
  QUALITY_AWARE: 0
  QUALITY_HIDDEN: 192
  QUALITY_PRIOR: [0.50, 0.65, 0.65]
  QUALITY_MIN_SCORE: 0.05
  MODALITY_ADAPTER: 0
  PART_BRANCH: 0
  CASS_FUSED_LOSS_WEIGHT: 1.0
  CASS_MODAL_LOSS_WEIGHT: 0.25
  CASS_PART_LOSS_WEIGHT: 0.5
INPUT:
  SIZE_TRAIN: [ 384, 192 ]
  SIZE_TEST: [384, 192 ]
  PROB: 0.5 # random horizontal flip
  RE_PROB: 0.5 # random erasing
  PADDING: 10
  GRAY_REPLACE_PROB: 0.3
  MODALITY_DROP_PROB: 0.1
DATASETS:
  NAMES: ('RGBNT201')
  ROOT_DIR: 'your_dataset_path'
DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 8
  NUM_WORKERS : 14
SOLVER:
  OPTIMIZER_NAME: 'AdamW'
  BASE_LR: 0.0001
  WEIGHT_DECAY: 0.05
  BACKBONE_LR_FACTOR: 0.1
  WARMUP_ITERS: 20
  IMS_PER_BATCH: 40
  MAX_EPOCHS: 120
TEST:
  RE_RANKING: 'yes'
  RERANK_K1: 50
  RERANK_K2: 15
  RERANK_LAMBDA: 0.3
  WEIGHT: ''
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'
OUTPUT_DIR: './outputs/CASS-Net'
