# Quality-aware CASS baseline: HTL-style CLS context plus CASS modality-quality weighting.
MODEL:
  CASS_ABLATION_STAGE: 'baseline'
  CASS_DESCRIPTOR_MODE: 'cls'
  CASS_CLS_CONTEXT_WEIGHT: 0.15
  CASS_QUALITY_AWARE: 1
  CASS_PART_BRANCH: 0
  CASS_NGA_MEMORY: 0
  AL: 1
  CASS_MODAL_LOSS_WEIGHT: 0.5
INPUT:
  MODALITY_DROP_PROB: 0.0
DATALOADER:
  NUM_INSTANCE: 8
SOLVER:
  IMS_PER_BATCH: 40
  MAX_EPOCHS: 120
  TRAIN_EPOCHS: 20
  AMP: True
  AMP_DTYPE: 'bf16'
