# A4 on the SQT-free mainline: continue from the strong A3 HSS+NGA best
# checkpoint and add only a conservative agreement CA-GF refinement.
MODEL:
  METHOD: 'CASS'
  CASS_ABLATION_STAGE: 'hss_nga_cagf'
  CASS_DESCRIPTOR_MODE: 'cls'
  CASS_CLS_CONTEXT_WEIGHT: 0.15
  CASS_QUALITY_AWARE: 0
  CASS_PART_BRANCH: 0
  CASS_NGA_MEMORY: 1
  CASS_NGA_REFRESH_PERIOD: 2
  CASS_NGA_WARMUP_EPOCHS: 5
  CASS_NGA_EMA_MOMENTUM: 0.5
  CASS_NGA_USE_PROTOTYPE: 1
  CASS_NGA_QUERY_ANCHOR: 1
  CASS_NGA_RESIDUAL_MODE: 'cross_mean'
  CASS_NGA_RESIDUAL_WEIGHT: 0.10
  CASS_CAGF_MODE: 'agreement'
  CASS_CAGF_RESIDUAL_WEIGHT: 0.05
  CASS_CAGF_MIN_AGREE: 0.35
  CASS_CAGF_AGREE_TAU: 0.10
  CASS_CAGF_MAX_GATE: 0.20
  CASS_CAGF_MAX_RESIDUAL_NORM: 0.12
  CASS_CAGF_DETACH_CONTEXT: 1
  CASS_CAGF_WARMUP_EPOCHS: 0
  CASS_CAGF_RAMP_EPOCHS: 2
  AL: 1
  ALIGN_LOSS_WEIGHT: 0.0
  TOKEN_CONSISTENCY_WEIGHT: 0.0
  GATE_BALANCE_WEIGHT: 0.0
  AUX_LOSS_WEIGHT: 0.0
  CASS_FUSED_LOSS_WEIGHT: 1.0
  CASS_MODAL_LOSS_WEIGHT: 0.5
  CASS_PART_LOSS_WEIGHT: 0.25
INPUT:
  MODALITY_DROP_PROB: 0.0
DATALOADER:
  NUM_INSTANCE: 8
SOLVER:
  IMS_PER_BATCH: 40
  MAX_EPOCHS: 120
  TRAIN_EPOCHS: 10
  BASE_LR: 0.00001
  AMP: True
  AMP_DTYPE: 'fp16'
  SCHEDULER_UNIT: 'iteration'
TEST:
  RERANK_K1: 50
  RERANK_K2: 15
  RERANK_LAMBDA: 0.3
