# A1 on top of the HTL-exact A0 recipe: add CASS HSS while keeping the
# training/evaluation contract that reproduced the 80.76 / 77.63 A0.
MODEL:
  METHOD: 'CASS'
  CASS_ABLATION_STAGE: 'hss'
  CASS_DESCRIPTOR_MODE: 'cls'
  CASS_CLS_CONTEXT_WEIGHT: 0.15
  CASS_QUALITY_AWARE: 0
  CASS_PART_BRANCH: 0
  CASS_NGA_MEMORY: 0
  AL: 1
  ALIGN_LOSS_WEIGHT: 0.0
  TOKEN_CONSISTENCY_WEIGHT: 0.0
  GATE_BALANCE_WEIGHT: 0.0
  AUX_LOSS_WEIGHT: 0.0
  CASS_FUSED_LOSS_WEIGHT: 1.0
  CASS_MODAL_LOSS_WEIGHT: 0.5
  CASS_PART_LOSS_WEIGHT: 0.25
INPUT:
  MODALITY_DROP_PROB: 0.0
DATALOADER:
  NUM_INSTANCE: 8
SOLVER:
  IMS_PER_BATCH: 40
  MAX_EPOCHS: 120
  TRAIN_EPOCHS: 20
  AMP: True
  AMP_DTYPE: 'fp16'
  SCHEDULER_UNIT: 'iteration'
TEST:
  RERANK_K1: 50
  RERANK_K2: 15
  RERANK_LAMBDA: 0.3
