# CA-GF repair v2: keep the repaired A3 descriptor and add only a small
# residual cross-modal fusion on top of query-anchored NGA + SQT additive.
MODEL:
  CASS_ABLATION_STAGE: 'hss_sqt_nga_cagf'
  CASS_CAGF_MODE: 'attention'
  CASS_QUALITY_AWARE: 0
  CASS_PART_BRANCH: 0
  CASS_SQT_USE_SELECTOR: 0
  CASS_SQT_FUSION_WEIGHT: 0.2
  CASS_SQT_DIVERSITY_WEIGHT: 0.0
  CASS_NGA_MEMORY: 1
  CASS_NGA_REFRESH_PERIOD: 2
  CASS_NGA_WARMUP_EPOCHS: 5
  CASS_NGA_EMA_MOMENTUM: 0.5
  CASS_NGA_USE_PROTOTYPE: 1
  CASS_NGA_QUERY_ANCHOR: 1
  CASS_NGA_RESIDUAL_MODE: 'sqt_gate'
  CASS_NGA_RESIDUAL_WEIGHT: 0.30
  CASS_CAGF_RESIDUAL_WEIGHT: 0.10
  CASS_CAGF_SELF_WEIGHT: 0.25
